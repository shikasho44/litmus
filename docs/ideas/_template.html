<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>（企画名）｜リトマス審問 企画ノート</title>
<!--
  企画ノートのひな形。新しい企画ページはこのファイルを複製して作る。
  - CSS はページの中に入れたまま（1ファイルで開けるように）。外部の読み込みはしない。
  - 書き方: 平易な日本語。一文一意。遊ぶ人の目線で先に書き、仕組みはあとで。
  - 使える部品: .card / .grid / table / .callout.kurare（先生のツボ）/ .callout.warn（注意）/ .badge / details（長い補足）
-->
<style>
  :root {
    --ink: #0B0D12; --ink-2: #141821; --ink-3: #1E2430;
    --bone: #F2EFE6; --bone-2: #D8D3C4; --bone-3: #A7A08F;
    --line: rgba(242, 239, 230, 0.14); --line-2: rgba(242, 239, 230, 0.26);
    --formalin: #C6FF3D; --formalin-deep: #6E9A0C;
    --alarm: #FF2E63; --cyan: #3DE0FF; --amber: #FFB020; --violet: #9B6BFF; --mute: #8A93A6;
    --sans: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--ink); color: var(--bone-2); font-family: var(--sans); font-size: 16px; line-height: 1.85; letter-spacing: .02em; }
  a { color: var(--cyan); text-underline-offset: 3px; }
  strong { color: var(--bone); }
  code { font-family: var(--mono); font-size: .86em; background: var(--ink-3); border: 1px solid var(--line); padding: .05em .4em; border-radius: 3px; color: var(--bone); word-break: break-word; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header.hero { border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(198,255,61,.06), transparent 70%); }
  header.hero .wrap { padding-top: 36px; padding-bottom: 28px; }
  .back { font-size: 13px; }
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .24em; color: var(--formalin); text-transform: uppercase; margin-top: 12px; }
  h1 { color: var(--bone); font-size: clamp(26px, 5vw, 40px); line-height: 1.3; margin: 8px 0 10px; }
  .lead { max-width: 780px; font-size: 17px; margin: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .badge { font-family: var(--mono); font-size: 12px; padding: 3px 10px; border: 1px solid var(--line-2); background: var(--ink-2); color: var(--bone-2); }
  .badge.ok { border-color: var(--formalin-deep); color: var(--formalin); }
  .badge.warn { border-color: rgba(255,176,32,.5); color: var(--amber); }
  .badge.no { border-color: rgba(255,46,99,.5); color: var(--alarm); }
  section { padding: 36px 0 4px; }
  h2 { color: var(--bone); font-size: clamp(21px, 3.4vw, 26px); line-height: 1.4; margin: 0 0 8px; }
  h2 .en { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .28em; color: var(--formalin); font-weight: 400; margin-bottom: 4px; }
  h3 { color: var(--bone); font-size: 17px; margin: 24px 0 8px; padding-left: 10px; border-left: 4px solid var(--formalin); line-height: 1.5; }
  p { margin: 8px 0; }
  ul, ol { padding-left: 1.3em; margin: 8px 0; }
  li + li { margin-top: 4px; }
  .note { font-size: 14px; color: var(--bone-3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .card { background: var(--ink-2); border: 1px solid var(--line); padding: 16px 18px; }
  .card h4 { margin: 0 0 6px; color: var(--bone); font-size: 16px; }
  .card .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--formalin); }
  .callout { border: 1px solid var(--line-2); border-left: 4px solid var(--cyan); background: var(--ink-2); padding: 12px 16px; margin: 14px 0; }
  .callout.kurare { border-left-color: var(--violet); }
  .callout.kurare::before { content: 'くられ先生のツボ'; display: block; font-size: 12px; letter-spacing: .12em; color: var(--violet); margin-bottom: 4px; }
  .callout.warn { border-left-color: var(--amber); }
  .callout.warn::before { content: '気をつけること'; display: block; font-size: 12px; letter-spacing: .12em; color: var(--amber); margin-bottom: 4px; }
  .callout.next { border-left-color: var(--formalin); }
  .callout.next::before { content: '次の一歩'; display: block; font-size: 12px; letter-spacing: .12em; color: var(--formalin); margin-bottom: 4px; }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 560px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--bone); background: var(--ink-3); font-weight: 700; white-space: nowrap; }
  details { background: var(--ink-2); border: 1px solid var(--line); padding: 10px 14px; margin: 10px 0; }
  details summary { cursor: pointer; color: var(--bone); }
  footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 18px 0 40px; font-size: 13px; color: var(--mute); }
  @media (max-width: 520px) { body { font-size: 15px; } .lead { font-size: 16px; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <a class="back" href="index.html">← 企画ノートの台帳へ</a>
    <div class="kicker">IDEA · I-000</div>
    <h1>（企画名）</h1>
    <p class="lead">（この企画を一言で。遊ぶ人の目線で。）</p>
    <div class="badges"><span class="badge">種類：事件</span><span class="badge warn">状態：種</span><span class="badge">作る大きさ：S</span></div>
  </div>
</header>
<main class="wrap">
  <section><h2><span class="en">PLAY</span>どんな遊びか</h2><p>…</p></section>
  <section><h2><span class="en">SCIENCE</span>科学の芯</h2><p>…</p></section>
  <section><h2><span class="en">WHY FUN</span>遊ぶ人にとっての面白さ</h2><p>…</p>
    <div class="callout kurare">…</div></section>
  <section><h2><span class="en">BUILD</span>作る大きさ・試作のいちばん小さい形</h2><p>…</p>
    <div class="callout warn">…</div>
    <div class="callout next">…</div></section>
</main>
<footer><div class="wrap">更新：2026-10-02 ／ リトマス審問 企画ノート（内部資料）</div></footer>
</body>
</html>
