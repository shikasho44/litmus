<!doctype html>

    <meta name="theme-color" content="#0B0D12" />
    <meta name="color-scheme" content="dark" />
    <!-- Removed at build time by src/build/html-env.ts when VITE_OFFICIAL_RELEASE_ENABLED=true -->
    <meta name="robots" content="noindex, nofollow" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />

    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <!-- ./og.jpg becomes absolute (and og:url + canonical are added) when VITE_SITE_URL is set: src/build/html-env.ts -->
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ガラスの破片でできた女性の影と、白衣を着た白ウサギの剥製ホルマ。薄暗い安置室。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="./og.jpg" />
    <meta name="twitter:image:alt" content="ガラスの破片でできた女性の影と、白衣を着た白ウサギの剥製ホルマ。薄暗い安置室。" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Logo glyph subsets of Dela Gothic One (kana / 審 / 問) so the title renders crisply on first paint -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/dela-gothic-one/files/dela-gothic-one-119-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/dela-gothic-one/files/dela-gothic-one-92-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/dela-gothic-one/files/dela-gothic-one-117-400-normal.woff2" />
    <!-- The title's largest paint: fetched next to the JS instead of after it (src/main.tsx warms the rest later) -->
    <link rel="preload" as="image" href="/art/key-art.webp" fetchpriority="high" />
    <!--
      Critical faces, declared here so the boot wait in src/main.tsx does not depend on the full
      fonts.css chunk (≈100 KB gz, ~240 unicode-range rules): the logo subsets preloaded above,
      the Zen Kaku kana subset and Anton Latin. Copied verbatim from src/styles/fonts.css —
      keep in sync when regenerating it (docs/frontend.md §Fonts). fonts.css re-declares them;
      identical rules share one download.
    -->

    <style>
      html,
      body {
        margin: 0;
        background: #0b0d12;
        color: #f2efe6;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0b0d12;
        font-family: ui-monospace, 'Consolas', monospace;
        letter-spacing: 0.3em;
        font-size: 11px;
        color: #8a93a6;
      }
      #boot .b {
        display: grid;
        gap: 14px;
        justify-items: center;
      }
      #boot .bar {
        width: 160px;
        height: 2px;
        background: #1e2430;
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #c6ff3d;
        animation: boot 1.1s cubic-bezier(0.7, 0, 0.3, 1) infinite;
      }
      @keyframes boot {
        from { transform: translateX(-100%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation: none; width: 100%; }
      }
      .noscript {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0d12;
        font-family: sans-serif;
        line-height: 1.8;
        text-align: center;
      }
      .noscript strong {
        display: block;
        color: #c6ff3d;
        font-size: 18px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Replaced when the app mounts (the boot splash covers it until then); what crawlers without JS read. -->
    <div id="app"><section class="seo-fallback"><h1>%VITE_APP_TITLE%</h1><p>%VITE_SITE_DESCRIPTION%</p></section></div>
    <div id="boot" aria-hidden="true">
      <div class="b">
        <span>ROOM ZERO — UNLOCKING</span>
        <span class="bar"></span>
      </div>
    </div>
    <noscript>
      <div class="noscript">
        <p>
          <strong>JavaScript を有効にしてください</strong>
          このゲームはブラウザで JavaScript を使って動きます。<br />
          ブラウザの設定で JavaScript を有効にしてから、もう一度開いてください。
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
